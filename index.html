<html>
<head>
    <title>Tomadachi Life</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #game {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
<div id="game"></div>

<script>
    EJS_player = "#game";
    EJS_core = "3ds";
    EJS_pathtodata = "data/";

    async function load3DS() {
        const parts = [
            "./roms/Tomodachi_Life.3ds.part01",
            "./roms/Tomodachi_Life.3ds.part02",
            "./roms/Tomodachi_Life.3ds.part03",
            "./roms/Tomodachi_Life.3ds.part04",
            "./roms/Tomodachi_Life.3ds.part05",
            "./roms/Tomodachi_Life.3ds.part06",
            "./roms/Tomodachi_Life.3ds.part07",
            "./roms/Tomodachi_Life.3ds.part08",
            "./roms/Tomodachi_Life.3ds.part09",
            "./roms/Tomodachi_Life.3ds.part10",
            "./roms/Tomodachi_Life.3ds.part11",
            "./roms/Tomodachi_Life.3ds.part12", 
            "./roms/Tomodachi_Life.3ds.part13",
            "./roms/Tomodachi_Life.3ds.part14",
            "./roms/Tomodachi_Life.3ds.part15",
            "./roms/Tomodachi_Life.3ds.part16",
            "./roms/Tomodachi_Life.3ds.part17",
            "./roms/Tomodachi_Life.3ds.part18",
            "./roms/Tomodachi_Life.3ds.part19",
            "./roms/Tomodachi_Life.3ds.part20",
            "./roms/Tomodachi_Life.3ds.part21"            
        ];

        const buffers = [];

        for (const part of parts) {
            console.log("Loading:", part);

            const response = await fetch(part);

            if (!response.ok) {
                throw new Error(`Failed to load ${part}: ${response.status}`);
            }

            buffers.push(await response.arrayBuffer());
        }

        const rom = new Blob(buffers, {
            type: "application/octet-stream"
        });

        EJS_gameUrl = URL.createObjectURL(rom);

        const script = document.createElement("script");
        script.src = EJS_pathtodata + "loader.js";
        document.body.appendChild(script);
    }

    load3DS().catch(console.error);
</script>
</body>
</html>
