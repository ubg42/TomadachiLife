<html>
<head>
    <title>Tomodachi Life</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #game {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="game"></div>

<script>
    // EmulatorJS configuration
    EJS_player = "#game";
    EJS_core = "azahar";

    // EmulatorJS data directory
    EJS_pathtodata = "data/";

    // Use the normal Azahar core
    EJS_forceLegacyCores = false;

    async function load3DS() {

        const parts = [
            "./roms/Tomodachi_Life.3ds.part01",
            "./roms/Tomodachi_Life.3ds.part02",
            "./roms/Tomodachi_Life.3ds.part03",
            "./roms/Tomodachi_Life.3ds.part04",
            "./roms/Tomodachi_Life.3ds.part05",
            "./roms/Tomodachi_Life.3ds.part06",
            "./roms/Tomodachi_Life.3ds.part07",
            "./roms/Tomodachi_Life.3ds.part08",
            "./roms/Tomodachi_Life.3ds.part09",
            "./roms/Tomodachi_Life.3ds.part10",
            "./roms/Tomodachi_Life.3ds.part11",
            "./roms/Tomodachi_Life.3ds.part12",
            "./roms/Tomodachi_Life.3ds.part13",
            "./roms/Tomodachi_Life.3ds.part14",
            "./roms/Tomodachi_Life.3ds.part15",
            "./roms/Tomodachi_Life.3ds.part16",
            "./roms/Tomodachi_Life.3ds.part17",
            "./roms/Tomodachi_Life.3ds.part18",
            "./roms/Tomodachi_Life.3ds.part19",
            "./roms/Tomodachi_Life.3ds.part20",
            "./roms/Tomodachi_Life.3ds.part21"
        ];

        const buffers = [];

        console.log("Loading Tomodachi Life...");

        for (let i = 0; i < parts.length; i++) {

            const part = parts[i];

            console.log(
                `Loading part ${i + 1}/${parts.length}:`,
                part
            );

            const response = await fetch(part);

            if (!response.ok) {
                throw new Error(
                    `Failed to load ${part}: HTTP ${response.status}`
                );
            }

            const buffer = await response.arrayBuffer();

            console.log(
                `Loaded part ${i + 1}: ${(buffer.byteLength / 1024 / 1024).toFixed(2)} MB`
            );

            buffers.push(buffer);
        }

        console.log("Joining parts...");

        // Combine all parts into one Blob
        const romBlob = new Blob(buffers, {
            type: "application/octet-stream"
        });

        console.log(
            "ROM size:",
            (romBlob.size / 1024 / 1024).toFixed(2),
            "MB"
        );

        // Give the ROM a real filename
        const romFile = new File(
            [romBlob],
            "Tomodachi_Life.3ds",
            {
                type: "application/octet-stream"
            }
        );

        // Create a temporary URL
        EJS_gameUrl = URL.createObjectURL(romFile);

        console.log("ROM ready:");
        console.log(EJS_gameUrl);

        // Start EmulatorJS
        const script = document.createElement("script");

        script.src = EJS_pathtodata + "loader.js";

        script.onload = () => {
            console.log("EmulatorJS loader loaded.");
        };

        script.onerror = () => {
            console.error(
                "Failed to load EmulatorJS loader:",
                script.src
            );
        };

        document.body.appendChild(script);
    }

    load3DS().catch(error => {
        console.error("3DS loading failed:", error);

        document.getElementById("game").innerHTML = `
            <div style="
                color:white;
                background:#111;
                width:100%;
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                font-family:Arial;
                text-align:center;
            ">
                <div>
                    <h2>Failed to load Tomodachi Life</h2>
                    <p>${error.message}</p>
                    <p>Open the browser console for more information.</p>
                </div>
            </div>
        `;
    });
</script>

</body>
</html>
